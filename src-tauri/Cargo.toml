[package]
name = "tauri-test"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-test"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

whoami ="1"
sha2 ="0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22.1"
calamine = {version = "0.34.0",features = ["dates"] }
rusqlite = {version = "0.39.0",features = ["bundled", "load_extension"] }

chrono = "0.4.44"
dirs = "6.0.0"
anyhow = "1.0.102"
tokio = {version = "1.50.0", features = ["full"] }

thiserror = "2.0.18"
log = "0.4.29"
regex = "1.12.3"

specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"

rayon = "1.12.0"
flume = "0.12.0"
num_enum = "0.7.6"
strum = { version = "0.28.0", features = ["derive"] }

quick-xml = {version = "0.38",features = ["encoding"] }
zip= {version = "0.6",default-features =false,features = ["deflate"] }
parking_lot = "0.12"
rust_xlsxwriter = "0.102.0"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort" 
codegen-units = 1 
opt-level = "s" 
strip = true 
