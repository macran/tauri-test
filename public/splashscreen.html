<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Input Tax</title>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        background: #071521;
        color: #e6f7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(24, 191, 255, 0.16),
            transparent 42%
          ),
          radial-gradient(
            circle at 88% 90%,
            rgba(68, 96, 255, 0.16),
            transparent 42%
          ),
          #071521;
      }

      body {
        display: grid;
        place-items: center;
      }

      .shell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .content {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }

      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        color: #06131d;
        background: #8cecff;
        box-shadow: 0 0 36px rgba(140, 236, 255, 0.28);
        font-size: 26px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      p {
        margin: 10px 0 0;
        color: rgba(230, 247, 255, 0.62);
        font-size: 13px;
        line-height: 1.6;
      }

      .loader {
        width: 100%;
        height: 4px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .loader::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #8cecff;
        box-shadow: 0 0 18px rgba(140, 236, 255, 0.7);
        animation: loading 1.2s ease-in-out infinite;
      }

      @keyframes loading {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(290%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader::after {
          animation: none;
          transform: translateX(80%);
        }
      }
    </style>
  </head>

  <body>
    <main class="shell" aria-label="正在启动 Input Tax">
      <section class="content">
        <div class="mark">IT</div>
        <h1>正在准备本地工作区</h1>
        <p>正在检查用户配置、共享盘和业务数据库</p>
        <div class="loader" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
